<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAIL COM Z 🇧🇷</title>
    <style>
        /* Estilização Geral (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #009c3b; /* Verde Brasil */
            color: #ffdf00; /* Amarelo Brasil */
            width: 100%;
            text-align: center;
            padding: 2.5rem 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: #fff;
            font-size: 1.1rem;
        }

        main {
            max-width: 700px;
            width: 90%;
            padding: 2rem;
            background: white;
            margin: 2rem 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: #002776; /* Azul Brasil */
            border-bottom: 3px solid #ffdf00;
            padding-bottom: 0.3rem;
        }

        .card {
            background: #f9f9f9;
            border-left: 6px solid #009c3b;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 4px;
        }

        .card h3 {
            margin-top: 0;
            color: #002776;
        }

        /* Botão Interativo */
        .btn-container {
            text-align: center;
            margin-top: 2rem;
        }

        button {
            background-color: #002776;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #001c54;
            transform: scale(1.05);
        }

        #fato-curioso {
            font-size: 1.1rem;
            font-weight: bold;
            color: #009c3b;
            text-align: center;
            margin-top: 1.5rem;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BRAIL COM Z 🇧🇷✈️</h1>
